<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Em Pauta, Voluntariado</title><desc id="d">Card editorial temporário para matéria aguardando fotografia original</desc><rect width="1200" height="675" fill="#F2D7DD"/><rect x="0" y="0" width="1200" height="22" fill="#0B2A52"/><circle cx="1040" cy="120" r="190" fill="#C57482" opacity=".16"/><circle cx="155" cy="590" r="230" fill="#0B2A52" opacity=".06"/><path d="M100 132h92l42 46-42 46h-92l-42-46z" fill="#0B2A52"/><text x="146" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">EP</text><rect x="255" y="135" width="4" height="84" fill="#C57482"/><text x="292" y="186" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#0B2A52">EM PAUTA</text><text x="100" y="340" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#C57482">VOLUNTARIADO</text><text x="100" y="420" font-family="Georgia,serif" font-size="56" font-weight="700" fill="#0B2A52">História real, imagem em atualização.</text><text x="100" y="485" font-family="Arial,sans-serif" font-size="27" fill="#334A68">A fotografia original será inserida pela redação após validação de crédito e uso.</text><path d="M100 555h150" stroke="#D49A23" stroke-width="8"/><text x="100" y="615" font-family="Arial,sans-serif" font-size="24" fill="#0B2A52">Histórias que aproximam. Pessoas que transformam.</text></svg>